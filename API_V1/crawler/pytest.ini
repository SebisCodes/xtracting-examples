[pytest]
# The unit suite and the doctests by default: neither needs a database.
# The flow tests are named explicitly, with DATABASE_URL set - see docs/USAGE.md:
#
#     DATABASE_URL=postgresql://... python -m pytest tests -q
#
testpaths = app tests/unit
# Every module carries its examples as doctests; they are the specification of
# the pieces that are easy to get subtly wrong (backoff, batching, tags).
addopts = --doctest-modules
# `app` is imported from this folder, `crawlkit` from the API_V1 folder. The
# crawler does not vendor crawlkit - it is the same code the dashboard runs, and
# a copy would be a copy that drifts.
pythonpath = . ..
markers =
    flow: needs a running archive (DATABASE_URL) and the stand-in site
