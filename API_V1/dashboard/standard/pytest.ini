[pytest]
# Only the unit suite by default: it needs no database. The flow tests are
# run by naming their folder, with DATABASE_URL set - see docs/DESIGN.md.
testpaths = tests/unit
# `app` is imported from this folder and `crawlkit` from the API_V1 folder.
pythonpath = . ../..
markers =
    flow: needs a running archive (DATABASE_URL)
